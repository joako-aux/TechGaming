<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGaming - Contacto</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Barra de navegación principal (Idéntica a index.html) -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand text-info fw-bold" href="index.html">■ TechGaming</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="index.html">Inicio</a>
                    <a class="nav-link" href="productos.html">Productos</a>
                    <a class="nav-link" href="nosotros.html">Nosotros</a>
                    <a class="nav-link" href="blogs.html">Blogs</a>
                    <a class="nav-link active" href="contacto.html">Contacto</a>
                </div>
                <!-- Barra de autenticación y carrito -->
                <div class="d-flex align-items-center gap-3">
                    <div class="text-secondary small">
                        <a href="login.html" class="text-white text-decoration-none">Iniciar sesión</a> | 
                        <a href="registro.html" class="text-white text-decoration-none">Registrar usuario</a>
                    </div>
                    <a class="btn btn-outline-info btn-sm" href="carrito.html">
                        🛒 Carrito (<span id="cart-count">0</span>)
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 p-4 bg-white">
                    <h2 class="text-dark fw-bold border-bottom border-info border-3 d-inline-block pb-1 mb-4">Contáctanos</h2>
                    
                    <form id="form-contacto">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold">Nombre:</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label fw-bold">Correo:</label>
                            <input type="email" id="correo" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="comentario" class="form-label fw-bold">Comentario (Máx 500 caracteres):</label>
                            <textarea id="comentario" class="form-control" rows="4" maxlength="500" required></textarea>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-2">
                            <a href="index.html" class="btn btn-outline-secondary">Volver al Inicio</a>
                            <button type="submit" class="btn btn-primary fw-bold">Enviar Comentario</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Pie de Página (Idéntico a index.html) -->
    <footer class="bg-dark text-white p-4 mt-auto">
        <div class="container">
            <div class="row gy-4 align-items-center">
                <div class="col-md-4 text-center text-md-start">
                    <p class="fw-bold mb-2">TechGaming</p>
                    <div class="d-flex gap-2 justify-content-center justify-content-md-start">
                        <span class="badge bg-primary">VISA</span>
                        <span class="badge bg-danger">MC</span>
                        <span class="badge bg-secondary">TC</span>
                    </div>
                </div>
                <div class="col-md-4 text-center">
                    <a href="productos.html" class="text-secondary text-decoration-none mx-2">Periféricos</a> |
                    <a href="productos.html" class="text-secondary text-decoration-none mx-2">Componentes</a> |
                    <a href="productos.html" class="text-secondary text-decoration-none mx-2">Accesorios</a>
                </div>
                <div class="col-md-4 text-center text-md-end">
                    <p class="small text-secondary mb-2">¡Suscríbete a nuestro boletín!</p>
                    <form onsubmit="alert('¡Gracias por suscribirte!'); return false;" class="d-flex gap-2">
                        <input type="email" class="form-control form-control-sm" placeholder="Ingresa tu correo" required>
                        <button type="submit" class="btn btn-info btn-sm fw-bold">Suscribirse</button>
                    </form>
                </div>
            </div>
            <div class="text-center text-secondary small border-top border-secondary pt-3 mt-4">
                © 2026 TechGaming - Todos los derechos reservados
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS (necesario para el menú responsive) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Scripts del proyecto -->
    <script src="assents/js/datos.js"></script>
    <script src="assents/js/validaciones.js"></script>
    <script src="assents/js/carrito.js"></script>
</body>
</html>
