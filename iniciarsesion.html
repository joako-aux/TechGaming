<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- 1. NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand text-info fw-bold" href="index.html">
                ■ TechGaming
            </a>

            <div class="navbar-nav ms-auto flex-row gap-3">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link" href="productos.html">Productos</a>
                <a class="nav-link" href="nosotros.html">Nosotros</a>
                <a class="nav-link" href="blogs.html">Blogs</a>
                <a class="nav-link" href="contacto.html">Contacto</a>
                <a class="nav-link text-info" href="carrito.html">🛒 Carrito (0)</a>
            </div>
        </div>
    </nav>

    <!-- 2. FORMULARIO DE INICIO DE SESIÓN -->
    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">

                <div class="card shadow border-0">
                    <div class="card-body p-4">

                        <h2 class="text-center fw-bold text-dark mb-4">
                            Iniciar Sesión
                        </h2>

                        <form id="form-login">

                            <!-- Campo Correo -->
                            <div class="mb-3">
                                <label for="login-correo" class="form-label fw-bold">
                                    Correo electrónico
                                </label>
                                <input 
                                    type="email" 
                                    class="form-control" 
                                    id="login-correo" 
                                    placeholder="ejemplo@duoc.cl">
                                <div id="errorCorreo" class="text-danger small mt-1"></div>
                            </div>

                            <!-- Campo Contraseña -->
                            <div class="mb-4">
                                <label for="login-password" class="form-label fw-bold">
                                    Contraseña
                                </label>
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    id="login-password" 
                                    placeholder="Ingresa tu contraseña">
                                <div id="errorPassword" class="text-danger small mt-1"></div>
                            </div>

                            <!-- Botón Iniciar Sesión -->
                            <button 
                                type="submit" 
                                class="btn btn-primary w-100 fw-bold">
                                Iniciar sesión
                            </button>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- 3. FOOTER -->
    <footer class="bg-dark text-white p-4 mt-auto">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <p class="mb-0 fw-bold">TechGaming</p>
                <small class="text-secondary">© 2026 - Todos los derechos reservados</small>
            </div>
            <div>
                <a href="productos.html" class="text-info text-decoration-none me-2">Periféricos</a> |
                <a href="productos.html" class="text-info text-decoration-none mx-2">Componentes</a> |
                <a href="productos.html" class="text-info text-decoration-none ms-2">Accesorios</a>
            </div>
        </div>
    </footer>

</body>

</html>
