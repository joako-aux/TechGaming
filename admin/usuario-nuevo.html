<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Nuevo Usuario | TechGaming</title>

    <!-- CDN Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Navegación principal -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand text-info fw-bold" href="../index.html">■ TechGaming - Admin</a>
            <div class="navbar-nav ms-auto flex-row gap-3">
                <a class="nav-link active" href="usuarios.html">Usuarios</a>
                <a class="nav-link text-info" href="../index.html">Ir al Sitio</a>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 p-4 bg-white">
                    <h2 class="text-dark fw-bold border-bottom border-info border-3 d-inline-block pb-1 mb-4">
                        Agregar Nuevo Usuario
                    </h2>

                    <form id="form-registro">
                        <div class="mb-3">
                            <label for="run" class="form-label fw-bold">RUN (sin puntos ni guión):</label>
                            <input type="text" id="run" class="form-control" placeholder="19011022K" required>
                        </div>

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold">Nombre:</label>
                            <input type="text" id="nombre" class="form-control" maxlength="50" required>
                        </div>

                        <div class="mb-3">
                            <label for="apellidos" class="form-label fw-bold">Apellidos:</label>
                            <input type="text" id="apellidos" class="form-control" maxlength="100" required>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label fw-bold">Correo Electrónico:</label>
                            <input type="email" id="correo" class="form-control" placeholder="usuario@duoc.cl" required>
                        </div>

                        <div class="mb-3">
                            <label for="rol" class="form-label fw-bold">Rol / Tipo de Usuario:</label>
                            <select id="rol" class="form-select" required>
                                <option value="Cliente">Cliente</option>
                                <option value="Vendedor">Vendedor</option>
                                <option value="Administrador">Administrador</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="region" class="form-label fw-bold">Región:</label>
                            <select id="region" class="form-select" required>
                                <option value="">-- Seleccione Región --</option>
                                <option value="rm">Región Metropolitana</option>
                                <option value="valpo">Región de Valparaíso</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="comuna" class="form-label fw-bold">Comuna:</label>
                            <select id="comuna" class="form-select" required disabled>
                                <option value="">-- Seleccione Comuna --</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="direccion" class="form-label fw-bold">Dirección:</label>
                            <input type="text" id="direccion" class="form-control" maxlength="300" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">Contraseña (4 a 10 caracteres):</label>
                            <input type="password" id="password" class="form-control" minlength="4" maxlength="10" required>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top mt-4">
                            <a href="usuarios.html" class="btn btn-outline-secondary">← Volver a Usuarios</a>
                            <button type="submit" class="btn btn-primary">Guardar Usuario</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-dark text-white p-4 mt-auto">
        <div class="container text-center text-md-start">
            <p class="mb-0 fw-bold">TechGaming - Panel de Administración</p>
            <small class="text-secondary">© 2026 - Todos los derechos reservados</small>
        </div>
    </footer>

    <!-- Scripts de validación -->
    <script src="../js/validaciones.js"></script>
</body>
</html>
