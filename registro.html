<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGaming - Registro de Usuario</title>

    <!-- Cargamos Bootstrap 5 desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Navbar principal -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand text-info fw-bold" href="index.html">
                ■ TechGaming
            </a>

            <!-- Enlaces de la barra de navegacion -->
            <div class="navbar-nav ms-auto flex-row gap-3">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link" href="productos.html">Productos</a>
                <a class="nav-link" href="nosotros.html">Nosotros</a>
                <a class="nav-link" href="blogs.html">Blogs</a>
                <a class="nav-link" href="contacto.html">Contacto</a>
                <a class="nav-link text-info" href="carrito.html">🛒 Carrito (<span id="cart-count">0</span>)</a>
            </div>
        </div>
    </nav>

    <!-- Formulario de registro -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold">
                        Registro de usuario
                    </div>
                    <div class="card-body p-4">
                        <!-- Evento onsubmit para validar antes de enviar -->
                        <form id="form-registro" onsubmit="validarRegistro(event)">
                            
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-bold">NOMBRE COMPLETO</label>
                                <input type="text" id="nombre" class="form-control" placeholder="Juan Pérez" required>
                            </div>

                            <div class="mb-3">
                                <label for="run" class="form-label fw-bold">RUN (Sin puntos ni guión)</label>
                                <input type="text" id="run" class="form-control" maxlength="9" placeholder="12345678K" required>
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label fw-bold">CORREO</label>
                                <input type="email" id="correo" class="form-control" placeholder="usuario@duoc.cl" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold">CONTRASEÑA</label>
                                <input type="password" id="password" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="confirm-password" class="form-label fw-bold">CONFIRMAR CONTRASEÑA</label>
                                <input type="password" id="confirm-password" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="telefono" class="form-label fw-bold">TELÉFONO (opcional)</label>
                                <input type="text" id="telefono" class="form-control" placeholder="+56912345678">
                            </div>

                            <!-- Seleccion de Region y Comuna dinamica -->
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="region" class="form-label fw-bold">Región</label>
                                    <select id="region" class="form-select" onchange="cargarComunas()" required>
                                        <option value="">-- Seleccione la región --</option>
                                        <option value="RM">Región Metropolitana de Santiago</option>
                                        <option value="AR">Región de la Araucanía</option>
                                        <option value="NB">Región de Ñuble</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="comuna" class="form-label fw-bold">Comuna</label>
                                    <select id="comuna" class="form-select" required disabled>
                                        <option value="">-- Seleccione la comuna --</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary fw-bold">REGISTRAR</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer comun del sitio -->
    <footer class="bg-dark text-white p-4 mt-auto">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <p class="mb-0 fw-bold">TechGaming</p>
                <small class="text-secondary">© 2026 - Todos los derechos reservados</small>
            </div>
            <div>
                <a href="productos.html" class="text-info text-decoration-none me-2">Periféricos</a> |
                <a href="productos.html" class="text-info text-decoration-none mx-2">Componentes</a> |
                <a href="productos.html" class="text-info text-decoration-none ms-2">Accesorios</a>
            </div>
        </div>
    </footer>

    <!-- Scripts del proyecto -->
    <script src="js/carrito.js"></script>
    <script>
        // Objeto con la lista de comunas por region
        const comunasPorRegion = {
            "RM": ["Santiago", "Providencia", "Maipú", "Las Condes"],
            "AR": ["Temuco", "Padre Las Casas", "Villarrica"],
            "NB": ["Chillán", "Linares", "Longaví", "Concepción"]
        };

        // Funcion para cambiar las comunas segun la region seleccionada
        function cargarComunas() {
            const regionSelect = document.getElementById("region").value;
            const comunaSelect = document.getElementById("comuna");
            
            // Limpiamos las opciones previas
            comunaSelect.innerHTML = '<option value="">-- Seleccione la comuna --</option>';

            // Si hay una region elegida cargamos sus comunas con un for
            if (regionSelect && comunasPorRegion[regionSelect]) {
                const lista = comunasPorRegion[regionSelect];
                for (let i = 0; i < lista.length; i++) {
                    comunaSelect.innerHTML += `<option value="${lista[i]}">${lista[i]}</option>`;
                }
                comunaSelect.disabled = false;
            } else {
                comunaSelect.disabled = true;
            }
        }

        // Funcion para validar los campos del formulario
        function validarRegistro(e) {
            e.preventDefault();

            const pass = document.getElementById("password").value;
            const confirm = document.getElementById("confirm-password").value;
            const correo = document.getElementById("correo").value;

            // Validar que las contraseñas coincidan
            if (pass !== confirm) {
                alert("Las contraseñas no coinciden.");
                return;
            }

            // Validar dominios permitidos
            if (!correo.includes("@duoc.cl") && !correo.includes("@profesor.duoc.cl") && !correo.includes("@gmail.com")) {
                alert("Dominio de correo no permitido.");
                return;
            }

            // Si todo esta bien avisa y redirige al login
            alert("¡Usuario registrado con éxito!");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
