<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGaming - Mi Perfil y Soporte</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Barra de navegación principal -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand text-info fw-bold" href="index.html">■ TechGaming</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="index.html">Inicio</a>
                    <a class="nav-link" href="productos.html">Productos</a>
                    <a class="nav-link" href="nosotros.html">Nosotros</a>
                    <a class="nav-link" href="blogs.html">Blogs</a>
                    <a class="nav-link" href="contacto.html">Contacto</a>
                </div>
                <!-- Barra de autenticación y carrito -->
                <div class="d-flex align-items-center gap-3">
                    <div class="text-secondary small">
                        <span id="nav-user-name" class="text-white fw-bold me-2">Cargando...</span>
                        <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
                    </div>
                    <a class="btn btn-outline-info btn-sm" href="carrito.html">
                        🛒 Carrito (<span id="cart-count">0</span>)
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Panel de Usuario y Soporte Postventa -->
    <main class="container my-5 flex-grow-1">
        <div class="row g-4 justify-content-center">
            
            <!-- TARJETA 1: Información del Usuario (RF-09: Rol Dinámico) -->
            <div class="col-lg-5">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
                        <span>Perfil de Usuario</span>
                        <span id="user-rol" class="badge bg-success">Cargando...</span>
                    </div>
                    <div class="card-body p-4 bg-white d-flex flex-column">
                        <div class="text-center mb-4">
                            <div class="display-4 text-primary mb-2">👤</div>
                            <h4 id="user-nombre" class="fw-bold mb-1">---</h4>
                            <p id="user-correo" class="text-muted">---</p>
                        </div>

                        <hr>

                        <div class="row g-3">
                            <div class="col-6">
                                <label class="text-muted small fw-bold">RUN</label>
                                <p id="user-run" class="fw-semibold mb-0">---</p>
                            </div>
                            <div class="col-6">
                                <label class="text-muted small fw-bold">TELÉFONO</label>
                                <p id="user-telefono" class="fw-semibold mb-0">---</p>
                            </div>
                            <div class="col-6">
                                <label class="text-muted small fw-bold">REGIÓN</label>
                                <p id="user-region" class="fw-semibold mb-0">---</p>
                            </div>
                            <div class="col-6">
                                <label class="text-muted small fw-bold">COMUNA</label>
                                <p id="user-comuna" class="fw-semibold mb-0">---</p>
                            </div>
                        </div>

                        <div class="d-grid mt-auto pt-4">
                            <button onclick="cerrarSesion()" class="btn btn-outline-danger">Cerrar Sesión</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TARJETA 2: Formulario RF-08 Soporte y Garantías -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-primary text-white fw-bold">
                        🛠️ Soporte Postventa y Garantías
                    </div>
                    <div class="card-body p-4 bg-white">
                        <form id="support-form" onsubmit="crearTicket(event)">
                            <div class="mb-3">
                                <label for="ticket-tipo" class="form-label fw-bold small text-muted">Tipo de Solicitud</label>
                                <select class="form-select" id="ticket-tipo" required>
                                    <option value="" selected disabled>Selecciona una opción</option>
                                    <option value="Consulta de Compatibilidad">Consulta de Compatibilidad</option>
                                    <option value="Solicitud de Garantía">Solicitud de Garantía</option>
                                    <option value="Fallo Técnico / Devolución">Fallo Técnico / Devolución</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="ticket-producto" class="form-label fw-bold small text-muted">Producto Asociado</label>
                                <input type="text" class="form-control" id="ticket-producto" placeholder="Ej: Tarjeta de Video RTX 4060 / Código SKU" required>
                            </div>

                            <div class="mb-3">
                                <label for="ticket-mensaje" class="form-label fw-bold small text-muted">Detalle de la consulta o falla</label>
                                <textarea class="form-control" id="ticket-mensaje" rows="4" placeholder="Describe brevemente tu problema o duda técnica..." required></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold">
                                📩 Enviar Solicitud de Soporte
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Historial de Tickets del Usuario -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold small">
                        📋 Mis Solicitudes de Soporte
                    </div>
                    <div class="card-body p-3">
                        <div id="lista-tickets" class="vstack gap-2">
                            <!-- Se renderiza dinámicamente mediante soporte.js -->
                            <p class="text-muted text-center py-3 mb-0">Cargando solicitudes...</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Pie de Página -->
    <footer class="bg-dark text-white p-4 mt-auto">
        <div class="container text-center text-secondary small">
            © 2026 TechGaming - Todos los derechos reservados
        </div>
    </footer>

    <!-- Bootstrap JS y Scripts del Proyecto -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assents/js/datos.js"></script>
    <script src="assents/js/carrito.js"></script>
    <script src="assents/js/soporte.js"></script>
</body>
</html>
