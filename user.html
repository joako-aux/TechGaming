<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGaming - Mi Perfil</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Barra de navegación principal -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand text-info fw-bold" href="index.html">■ TechGaming</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="index.html">Inicio</a>
                    <a class="nav-link" href="productos.html">Productos</a>
                    <a class="nav-link" href="nosotros.html">Nosotros</a>
                    <a class="nav-link" href="blogs.html">Blogs</a>
                    <a class="nav-link" href="contacto.html">Contacto</a>
                </div>
                <!-- Barra de autenticación y carrito -->
                <div class="d-flex align-items-center gap-3">
                    <div class="text-secondary small">
                        <span id="nav-user-name" class="text-white fw-bold me-2">Cargando...</span>
                        <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
                    </div>
                    <a class="btn btn-outline-info btn-sm" href="carrito.html">
                        🛒 Carrito (<span id="cart-count">0</span>)
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Panel de Perfil de Usuario -->
    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
                        <span>Perfil de Usuario</span>
                        <span class="badge bg-success">Cliente</span>
                    </div>
                    <div class="card-body p-4 bg-white">
                        <div class="text-center mb-4">
                            <div class="display-4 text-primary mb-2">👤</div>
                            <h4 id="user-nombre" class="fw-bold mb-1">---</h4>
                            <p id="user-correo" class="text-muted">---</p>
                        </div>

                        <hr>

                        <div class="row g-3">
                            <div class="col-6">
                                <label class="text-muted small fw-bold">RUN</label>
                                <p id="user-run" class="fw-semibold">---</p>
                            </div>
                            <div class="col-6">
                                <label class="text-muted small fw-bold">TELÉFONO</label>
                                <p id="user-telefono" class="fw-semibold">---</p>
                            </div>
                            <div class="col-6">
                                <label class="text-muted small fw-bold">REGIÓN</label>
                                <p id="user-region" class="fw-semibold">---</p>
                            </div>
                            <div class="col-6">
                                <label class="text-muted small fw-bold">COMUNA</label>
                                <p id="user-comuna" class="fw-semibold">---</p>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button onclick="cerrarSesion()" class="btn btn-outline-danger">Cerrar Sesión</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Pie de Página -->
    <footer class="bg-dark text-white p-4 mt-auto">
        <div class="container text-center text-secondary small">
            © 2026 TechGaming - Todos los derechos reservados
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assents/js/datos.js"></script>
    <script src="assents/js/carrito.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Verificar si hay sesión activa
            const usuarioLogueado = JSON.parse(sessionStorage.getItem("usuarioLogueado"));

            if (!usuarioLogueado) {
                alert("Debes iniciar sesión para acceder a esta página.");
                window.location.href = "login.html";
                return;
            }

            // Mostrar los datos en la interfaz
            document.getElementById("nav-user-name").textContent = usuarioLogueado.nombre || "Usuario";
            document.getElementById("user-nombre").textContent = usuarioLogueado.nombre || "No registrado";
            document.getElementById("user-correo").textContent = usuarioLogueado.correo || "No registrado";
            document.getElementById("user-run").textContent = usuarioLogueado.run || "No especificado";
            document.getElementById("user-telefono").textContent = usuarioLogueado.telefono || "No especificado";
            document.getElementById("user-region").textContent = usuarioLogueado.region || "No especificada";
            document.getElementById("user-comuna").textContent = usuarioLogueado.comuna || "No especificada";
        });

        function cerrarSesion() {
            sessionStorage.removeItem("usuarioLogueado");
            alert("Sesión cerrada correctamente.");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
