<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto - TechGaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand text-info fw-bold" href="index.html">■ TechGaming</a>
            <div class="navbar-nav ms-auto flex-row gap-3">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link active" href="productos.html">Productos</a>
                <a class="nav-link" href="nosotros.html">Nosotros</a>
                <a class="nav-link" href="blogs.html">Blogs</a>
                <a class="nav-link" href="contacto.html">Contacto</a>
                <a class="nav-link text-info" href="carrito.html">🛒 Carrito (<span id="cart-count">0</span>)</a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="card shadow-sm border-0 p-4 bg-white" id="detalle-container">
            <!-- Renderizado dinámico vía Script -->
        </div>
    </main>

    <footer class="bg-dark text-white p-4 mt-auto">
        <div class="container text-center text-md-start">
            <p class="mb-0 fw-bold">TechGaming</p>
            <small class="text-secondary">© 2026 - Todos los derechos reservados</small>
        </div>
    </footer>

    <script src="js/datos.js"></script>
    <script src="js/carrito.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("detalle-container");
            const urlParams = new URLSearchParams(window.location.search);
            const prodId = parseInt(urlParams.get("id"));

            let producto = null;
            if (typeof PRODUCTOS_INICIALES !== 'undefined') {
                producto = PRODUCTOS_INICIALES.find(p => p.id === prodId);
            }

            if (!producto) {
                container.innerHTML = `
                    <div class="text-center py-4">
                        <h3>Producto no encontrado</h3>
                        <p class="text-muted">El producto seleccionado no existe o fue removido.</p>
                        <a href="productos.html" class="btn btn-primary mt-2">Volver al Catálogo</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="row g-4 align-items-center">
                    <div class="col-md-5 text-center">
                        <img src="${producto.imagen}" alt="${producto.nombre}" class="img-fluid rounded p-3" style="max-height: 300px; object-fit: contain;">
                    </div>
                    <div class="col-md-7">
                        <span class="badge bg-info text-dark mb-2">${producto.categoria || 'Gamer'}</span>
                        <h2 class="fw-bold text-dark">${producto.nombre}</h2>
                        <h3 class="text-primary fw-bold my-3">$${producto.precio.toLocaleString('es-CL')}</h3>
                        <p class="text-secondary mb-4">${producto.descripcion || 'Sin descripción disponible.'}</p>
                        
                        <div class="d-flex gap-2 flex-wrap">
                            <button onclick="agregarAlCarrito(${producto.id})" class="btn btn-primary">
                                🛒 Agregar al Carrito
                            </button>
                            <a href="productos.html" class="btn btn-outline-secondary">
                                ← Volver a Productos
                            </a>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
