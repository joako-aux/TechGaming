<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGaming - Catálogo de Productos</title>
    <link rel="stylesheet" href="assents/css/estilos1.css">
</head>
<body>

    <!-- Header Principal -->
    <header class="main-header">
        <div class="logo">
            <span class="square-icon">■</span>
            <h1>TechGaming</h1>
        </div>
        <nav class="main-nav">
            <a href="index.html">Inicio</a>
            <a href="productos.html" class="active">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="blogs.html">Blogs</a>
            <a href="contacto.html">Contacto</a>
        </nav>
        <div class="cart-status">
            <a href="carrito.html">🛒 Carrito (<span id="cart-count">0</span>)</a>
        </div>
    </header>

    <div class="container">
        <!-- Barra de autenticación superior -->
        <div class="user-bar">
            <a href="login.html">Iniciar sesión</a> | 
            <a href="registro.html">Registrar usuario</a>
        </div>

        <section class="catalog-section">
            <h2>Nuestros Productos</h2>

            <!-- Estructura principal con filtros laterales y listado -->
            <div class="catalog-layout" style="display: flex; gap: 20px; margin-top: 20px;">
                
                <!-- Panel Lateral de Filtros -->
                <aside class="sidebar-filters" style="flex: 1; max-width: 250px; background: #f4f4f4; padding: 15px; border-radius: 8px;">
                    <h3>Filtros</h3>
                    
                    <!-- Búsqueda -->
                    <div class="filter-group" style="margin-bottom: 15px;">
                        <label for="search-input"><strong>Buscar:</strong></label>
                        <input type="text" id="search-input" placeholder="Ej. Teclado, Mouse..." style="width: 100%; padding: 8px; margin-top: 5px;">
                    </div>

                    <!-- Categorías -->
                    <div class="filter-group" style="margin-bottom: 15px;">
                        <label for="category-select"><strong>Categoría:</strong></label>
                        <select id="category-select" style="width: 100%; padding: 8px; margin-top: 5px;">
                            <option value="todas">Todas</option>
                            <option value="perifericos">Periféricos</option>
                            <option value="componentes">Componentes</option>
                            <option value="accesorios">Accesorios</option>
                        </select>
                    </div>

                    <!-- Ordenar -->
                    <div class="filter-group" style="margin-bottom: 15px;">
                        <label for="sort-select"><strong>Ordenar por:</strong></label>
                        <select id="sort-select" style="width: 100%; padding: 8px; margin-top: 5px;">
                            <option value="predeterminado">Predeterminado</option>
                            <option value="precio-bajo">Precio: Menor a Mayor</option>
                            <option value="precio-alto">Precio: Mayor a Menor</option>
                        </select>
                    </div>
                </aside>

                <!-- Grid de Productos -->
                <main style="flex: 3;">
                    <section class="products-grid" id="catalogo-completo">
                        <!-- Renderizado dinámico desde JS -->
                    </section>
                </main>

            </div>
        </section>
    </div>

    <!-- Pie de página -->
    <footer class="main-footer">
        <div class="footer-col">
            <p><strong>TechGaming</strong></p>
            <div class="payment-methods">
                <span class="badge badge-visa">VISA</span>
                <span class="badge badge-mastercard">MC</span>
                <span class="badge badge-tc">TC</span>
            </div>
        </div>
        <div class="footer-col footer-links">
            <a href="productos.html">Periféricos</a> |
            <a href="productos.html">Componentes</a> |
            <a href="productos.html">Accesorios</a>
        </div>
        <div class="footer-col newsletter">
            <p><small>¡Mantente en contacto! Suscríbete a nuestro boletín:</small></p>
            <form onsubmit="alert('¡Gracias por suscribirte!'); return false;">
                <input type="email" placeholder="Ingresa tu correo" required>
                <button type="submit">Suscribirse</button>
            </form>
        </div>
    </footer>

    <!-- Scripts de la app -->
    <script src="js/datos.js"></script>
    <script src="js/carrito.js"></script>
    <script>
        const gridContainer = document.getElementById("catalogo-completo");
        const searchInput = document.getElementById("search-input");
        const categorySelect = document.getElementById("category-select");
        const sortSelect = document.getElementById("sort-select");

        // Función para renderizar tarjetas
        function renderizarProductos(productos) {
            gridContainer.innerHTML = "";
            
            if (productos.length === 0) {
                gridContainer.innerHTML = "<p>No se encontraron productos que coincidan con los filtros.</p>";
                return;
            }

            productos.forEach(prod => {
                gridContainer.innerHTML += `
                    <div class="product-card">
                        <div class="product-img">
                            <img src="${prod.imagen}" alt="${prod.nombre}" onerror="this.src='https://via.placeholder.com/200x120?text=Producto'">
                        </div>
                        <a href="detalle-producto.html?id=${prod.id}" class="product-title">${prod.nombre}</a>
                        <div class="product-info">
                            <span class="attributes">${prod.categoria || 'Gamer / Tech'}</span>
                            <span class="price">$${prod.precio.toLocaleString('es-CL')}</span>
                        </div>
                        <button onclick="agregarAlCarrito(${prod.id})" class="btn-banner" style="width:100%; margin-top:10px; border:none; cursor:pointer;">
                            🛒 Añadir al carrito
                        </button>
                    </div>
                `;
            });
        }

        // Función para filtrar y ordenar los datos de datos.js
        function aplicarFiltros() {
            if (typeof PRODUCTOS_INICIALES === 'undefined') return;

            let resultado = [...PRODUCTOS_INICIALES];

            // 1. Buscador por nombre
            const textoBusqueda = searchInput.value.toLowerCase().trim();
            if (textoBusqueda !== "") {
                resultado = resultado.filter(p => p.nombre.toLowerCase().includes(textoBusqueda));
            }

            // 2. Filtro por categoría (si el objeto del producto posee la propiedad 'categoria')
            const categoria = categorySelect.value;
            if (categoria !== "todas") {
                resultado = resultado.filter(p => p.categoria && p.categoria.toLowerCase() === categoria);
            }

            // 3. Ordenamiento
            const orden = sortSelect.value;
            if (orden === "precio-bajo") {
                resultado.sort((a, b) => a.precio - b.precio);
            } else if (orden === "precio-alto") {
                resultado.sort((a, b) => b.precio - a.precio);
            }

            renderizarProductos(resultado);
        }

        // Eventos de escucha para los filtros
        searchInput.addEventListener("input", aplicarFiltros);
        categorySelect.addEventListener("change", aplicarFiltros);
        sortSelect.addEventListener("change", aplicarFiltros);

        // Carga inicial al abrir la página
        document.addEventListener("DOMContentLoaded", () => {
            aplicarFiltros();
        });
    </script>
</body>
</html>
