<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGaming - Catálogo de Productos</title>

    <!-- CDN Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Navegacion principal -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand text-info fw-bold" href="index.html">
                ■ TechGaming
            </a>

            <!-- Menu de navegacion -->
            <div class="navbar-nav ms-auto flex-row gap-3">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link active" href="productos.html">Productos</a>
                <a class="nav-link" href="nosotros.html">Nosotros</a>
                <a class="nav-link" href="blogs.html">Blogs</a>
                <a class="nav-link" href="contacto.html">Contacto</a>
                <a class="nav-link text-info" href="carrito.html">🛒 Carrito (<span id="cart-count">0</span>)</a>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container my-4">

        <!-- Barra de autenticacion de usuario -->
        <div class="text-end mb-3">
            <a href="login.html" class="text-decoration-none fw-bold text-primary me-2">Iniciar sesión</a> |
            <a href="registro.html" class="text-decoration-none fw-bold text-primary ms-2">Registrar usuario</a>
        </div>

        <h2 class="text-dark fw-bold border-bottom border-info border-3 d-inline-block pb-1 mb-4">
            Catálogo de Productos
        </h2>

        <div class="row g-4">
            <!-- Panel Lateral de Filtros -->
            <aside class="col-lg-3">
                <div class="card shadow-sm border-0 p-3 bg-white">
                    <h5 class="fw-bold mb-3">Filtros</h5>

                    <!-- Buscador -->
                    <div class="mb-3">
                        <label for="search-input" class="form-label fw-bold small">Buscar:</label>
                        <input type="text" id="search-input" class="form-control" placeholder="Ej. Teclado, Mouse...">
                    </div>

                    <!-- Categorias -->
                    <div class="mb-3">
                        <label for="category-select" class="form-label fw-bold small">Categoría:</label>
                        <select id="category-select" class="form-select">
                            <option value="todas">Todas</option>
                            <option value="perifericos">Periféricos</option>
                            <option value="componentes">Componentes</option>
                            <option value="accesorios">Accesorios</option>
                            <option value="monitores">Monitores</option>
                        </select>
                    </div>

                    <!-- Ordenar -->
                    <div class="mb-2">
                        <label for="sort-select" class="form-label fw-bold small">Ordenar por:</label>
                        <select id="sort-select" class="form-select">
                            <option value="predeterminado">Predeterminado</option>
                            <option value="precio-bajo">Precio: Menor a Mayor</option>
                            <option value="precio-alto">Precio: Mayor a Menor</option>
                        </select>
                    </div>
                </div>
            </aside>

            <!-- Grid de Productos -->
            <section class="col-lg-9">
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3" id="catalogo-completo">
                    <!-- Productos renderizados con JS -->
                </div>
            </section>
        </div>

    </main>

    <!-- Pie de pagina -->
    <footer class="bg-dark text-white p-4 mt-auto">
        <div class="container">
            <div class="row g-3 align-items-center">
                <div class="col-md-4">
                    <p class="mb-1 fw-bold">TechGaming</p>
                    <div>
                        <span class="badge bg-secondary">VISA</span>
                        <span class="badge bg-secondary">MC</span>
                        <span class="badge bg-secondary">TC</span>
                    </div>
                </div>
                <div class="col-md-4 text-center">
                    <a href="productos.html" class="text-info text-decoration-none me-2">Periféricos</a> |
                    <a href="productos.html" class="text-info text-decoration-none mx-2">Componentes</a> |
                    <a href="productos.html" class="text-info text-decoration-none ms-2">Accesorios</a>
                </div>
                <div class="col-md-4 text-end">
                    <small class="text-secondary">© 2026 - Todos los derechos reservados</small>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts (Ruta ajustada exactamente a tus archivos del repo) -->
    <script src="js/datos.js"></script>
    <script src="js/carrito.js"></script>
    <script>
        const gridContainer = document.getElementById("catalogo-completo");
        const searchInput = document.getElementById("search-input");
        const categorySelect = document.getElementById("category-select");
        const sortSelect = document.getElementById("sort-select");

        // Renderizar tarjetas con diseño de Bootstrap
        function renderizarProductos(productos) {
            gridContainer.innerHTML = "";

            if (productos.length === 0) {
                gridContainer.innerHTML = `
                    <div class="col-12 text-center py-4">
                        <p class="text-muted fs-5">No se encontraron productos que coincidan con los filtros.</p>
                    </div>`;
                return;
            }

            productos.forEach(prod => {
                gridContainer.innerHTML += `
                    <div class="col">
                        <div class="card h-100 shadow-sm border-0">
                            <img src="${prod.imagen}" class="card-img-top p-3" alt="${prod.nombre}" style="height: 180px; object-fit: contain;" onerror="this.src='https://via.placeholder.com/200x180?text=Producto'">
                            <div class="card-body d-flex flex-column">
                                <a href="detalle-producto.html?id=${prod.id}" class="text-decoration-none">
                                    <h6 class="card-title text-primary fw-bold mb-2">${prod.nombre}</h6>
                                </a>
                                <small class="text-muted mb-2">${prod.categoria || 'Gamer / Tech'}</small>
                                <div class="mt-auto pt-2 border-top d-flex justify-content-between align-items-center">
                                    <span class="fw-bold fs-5 text-dark">$${prod.precio.toLocaleString('es-CL')}</span>
                                </div>
                                <button onclick="agregarAlCarrito(${prod.id})" class="btn btn-sm btn-primary w-100 mt-2">
                                    🛒 Añadir al carrito
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Filtro y Ordenamiento dinamico
        function aplicarFiltros() {
            if (typeof PRODUCTOS_INICIALES === 'undefined') return;

            let resultado = [...PRODUCTOS_INICIALES];

            // 1. Buscador
            const textoBusqueda = searchInput.value.toLowerCase().trim();
            if (textoBusqueda !== "") {
                resultado = resultado.filter(p => p.nombre.toLowerCase().includes(textoBusqueda));
            }

            // 2. Categoria
            const categoria = categorySelect.value;
            if (categoria !== "todas") {
                resultado = resultado.filter(p => p.categoria && p.categoria.toLowerCase() === categoria);
            }

            // 3. Orden
            const orden = sortSelect.value;
            if (orden === "precio-bajo") {
                resultado.sort((a, b) => a.precio - b.precio);
            } else if (orden === "precio-alto") {
                resultado.sort((a, b) => b.precio - a.precio);
            }

            renderizarProductos(resultado);
        }

        // Listeners de eventos
        searchInput.addEventListener("input", aplicarFiltros);
        categorySelect.addEventListener("change", aplicarFiltros);
        sortSelect.addEventListener("change", aplicarFiltros);

        // Carga inicial
        document.addEventListener("DOMContentLoaded", () => {
            aplicarFiltros();
        });
    </script>
</body>
</html>
